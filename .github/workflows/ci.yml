name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `next build` compiles every route handler, catching most breakages.
      # config uses `?? ""` fallbacks, so no secrets are needed at build time.
      - run: npm run build

  unit:
    name: Unit tests (DB & R2 structure contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  firestore:
    name: Firestore emulator integration
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: demo-genaie
      # Used to hash canonical account-link invite tokens; any value works against the emulator.
      ACCOUNT_LINK_SETUP_SECRET: ci-test-secret
      # Job Scout Gmail readiness reads encrypted tokens from the local store.
      # These are throwaway CI values and never contain production credentials.
      TOKEN_ENCRYPTION_SECRET: ci-test-secret
      TOKEN_STORE_PATH: /tmp/agent-genaie-firestore-tokens.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The emulator runs on the JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools requires Java 21+ for the emulator runtime.
          java-version: 21
      - run: npm ci
      # getFirebaseAdminApp() requires a service account via cert(), but the
      # emulator ignores the credential — a well-formed throwaway key is enough.
      - name: Generate throwaway service account
        run: |
          KEY=$(openssl genrsa 2048 2>/dev/null)
          PK=$(printf '%s' "$KEY" | awk 'BEGIN{ORS="\\n"}{print}')
          SA=$(printf '{"type":"service_account","project_id":"demo-genaie","private_key_id":"ci","private_key":"%s","client_email":"ci@demo-genaie.iam.gserviceaccount.com","client_id":"1","token_uri":"https://oauth2.googleapis.com/token"}' "$PK")
          echo "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64=$(printf '%s' "$SA" | base64 -w0)" >> "$GITHUB_ENV"
      # emulators:exec starts the emulator, exports FIRESTORE_EMULATOR_HOST for
      # the test command, then tears the emulator down.
      - name: Run integration tests against Firestore emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-genaie "npm run test:integration:firestore"

  r2:
    name: R2 / S3 integration (LocalStack)
    runs-on: ubuntu-latest
    env:
      # getR2Client() requires R2_ACCOUNT_ID even though the local S3 endpoint
      # ignores it (the explicit R2_ENDPOINT is what's actually used).
      R2_ACCOUNT_ID: test
      R2_ENDPOINT: http://127.0.0.1:4566
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET: cv-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # LocalStack provides a freely pullable S3-compatible endpoint on :4566.
      # It replaces MinIO, whose community images are now gated behind auth on
      # both Docker Hub and quay.io.
      - name: Start LocalStack (S3)
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e SERVICES=s3 \
            localstack/localstack
      - name: Wait for S3 and create bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4566/_localstack/health | grep -Eq '"s3": *"(available|running)"'; then break; fi
            sleep 2
          done
          aws --endpoint-url http://127.0.0.1:4566 s3 mb "s3://${R2_BUCKET}"
      - run: npm run test:integration:r2
      - name: LocalStack logs on failure
        if: failure()
        continue-on-error: true
        run: docker logs localstack || true
